# ---------------------------------------------------------------------------
# controlled-vocab.yaml
#
# AUTHORITATIVE controlled vocabulary for spectral dataset records.
#
# The inline enumerations in datasets/RECORD-FORMAT.md defer to this file.
# If the two disagree, this file wins and RECORD-FORMAT.md must be corrected.
#
# - `domains` fixes the stable domain_id, the unprefixed folder slug, the
#   display name, and the presentation sequence.
# - `enums` holds the allowed values plus accepted aliases, so incoming
#   records can be normalised instead of rejected.
# - Sets marked `provisional: true` are expected to gain values as real
#   records arrive; sets marked false are considered stable.
#
# Alias matching: fold the Unicode characters below, trim whitespace,
# lowercase, then look the result up in `aliases`. Canonical values are
# lowercase with hyphens, and must not be changed without a migration.
# ---------------------------------------------------------------------------

version: 4
updated: "2026-11-23"

normalisation:
  case: lower
  trim: true
  unicode_fold:
    "µ": "u"          # micro sign
    "μ": "u"          # Greek mu
    "Å": "angstrom"
    "⁻¹": "-1"
  note: >
    Fold, trim and lowercase before alias lookup. Alias keys are written in
    their common spelling for readability; matching is case-insensitive.

# ---------------------------------------------------------------------------
# Domains
#
# `domain_id` is permanent and is the stable key used by records.
# `sequence` is display order only; it reproduces the numbering of
# .documents/domain-reviews.md without encoding it in folder names. Sequence
# may be changed without touching records. Existing IDs are never reused;
# merged records adopt the destination ID, and retired IDs are recorded below.
# ---------------------------------------------------------------------------

