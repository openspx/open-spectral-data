# ---------------------------------------------------------------------------
# Enumerations
# ---------------------------------------------------------------------------

enums:

  record_type:
    provisional: false
    canonical: [dataset, collection, aggregator, portal]
    aliases: {}

  status:
    provisional: false
    canonical: [active, deprecated, draft]
    aliases: {}

  confidence:
    provisional: false
    note: >
      Evidence support for the catalogue description at its stated release/scope,
      independent of status and dates; not scientific accuracy or reuse permission.
      Historical primary evidence may support confidence. A subset does not validate
      an entire library; retain unknowns and restrictions at every confidence level.
    canonical: [high, medium, low]
    aliases: {}

  reference_variable_kind:
    provisional: false
    canonical: [continuous, categorical, ordinal, text]
    aliases:
      numeric: continuous
      numerical: continuous
      float: continuous
      integer: continuous
      class: categorical
      label: categorical
      ordered: ordinal
      free-text: text
      string: text

  measured:
    provisional: false
    note: >
      Tri-state. true is a laboratory or direct measurement; false is a value
      derived, estimated, predicted, assigned or inherited from another
      variable; unknown means the source does not establish either. unknown is
      not a synonym for false.
    canonical: [true, false, unknown]
    aliases: {}

  count_qualifier:
    provisional: false
    note: >
      Qualifies a numeric count. exact means the stated number is exact; gte
      means "at least"; approx means approximate; unknown means no reliable
      count. A missing qualifier is read as unknown, never exact.
    canonical: [exact, gte, approx, unknown]
    aliases:
      min: gte
      at-least: gte
      greater-than-or-equal: gte
      approximately: approx
      about: approx
      "~": approx

  platform:
    provisional: true
    note: >
      Provisional: expects additions for rover, balloon, UAV-swarm and
      laboratory-microscope platforms. Existing values cover the current
      domains and should not be renamed.
    canonical:
      - laboratory
      - benchtop-imaging
      - handheld
      - field
      - uav
      - airborne
      - satellite
      - telescope
      - borehole
      - other
    aliases:
      lab: laboratory
      laboratory-bench: laboratory
      benchtop: laboratory
      bench: laboratory
      imaging-lab: benchtop-imaging
      hyperspectral-imaging: benchtop-imaging
      imaging-spectrometer: benchtop-imaging
      field-portable: handheld
      portable: handheld
      proximal: field
      field-based: field
      drone: uav
      UAS: uav
      RPAS: uav
      unmanned-aerial-vehicle: uav
      aircraft: airborne
      plane: airborne
      airborne-campaign: airborne
      spaceborne: satellite
      orbital: satellite
      spacecraft: satellite
      ground-based: telescope
      observatory: telescope
      downhole: borehole
      well-log: borehole
      other-platform: other

  access_class:
    provisional: false
    note: >
      Stable. Use `mixed` when some components are open and others are not,
      and explain the split in access_notes.
    canonical:
      - open
      - registration
      - on-request
      - closed
      - mixed
    aliases:
      public: open
      open-access: open
      freely-available: open
      download: open
      signup: registration
      sign-up: registration
      registration-required: registration
      login: registration
      account-required: registration
      request: on-request
      by-request: on-request
      author-request: on-request
      contact-author: on-request
      application: on-request
      restricted: closed
      private: closed
      embargoed: closed
      unavailable: closed
      partial: mixed
      mixed-access: mixed

  measurement_mode:
    provisional: true
    note: >
      Provisional: polarisation, interferometric phase and time-resolved
      modes are not yet first-class values. Use `other` with intensity_units
      until they are. `flux` covers astronomical relative and absolute flux,
      and `SIF` maps to `radiance` because it is an at-sensor radiance
      measurement.
    canonical:
      - reflectance
      - transmittance
      - absorbance
      - radiance
      - irradiance
      - emission
      - flux
      - other
    aliases:
      vis-nir: reflectance
      VNIR: reflectance
      VisNIR: reflectance
      vis/nir: reflectance
      diffuse-reflectance: reflectance
      DR: reflectance
      bidirectional-reflectance: reflectance
      hemispherical-reflectance: reflectance
      reflection: reflectance
      transmission: transmittance
      direct-transmission: transmittance
      transmissivity: transmittance
      optical-density: absorbance
      OD: absorbance
      ftir-absorbance: absorbance
      absorption: absorbance
      at-sensor-radiance: radiance
      spectral-radiance: radiance
      SIF: radiance
      solar-induced-fluorescence: radiance
      spectral-irradiance: irradiance
      downwelling-irradiance: irradiance
      upwelling-irradiance: irradiance
      emissivity: emission
      thermal-emission: emission
      thermal-infrared-emission: emission
      relative-flux: flux
      absolute-flux: flux
      spectral-flux: flux
      counts: flux
      intensity: flux
      other-mode: other

  spectral_units:
    provisional: false
    note: >
      Allowed axis units. A record lists one or more of these in spectral_units,
      even when only one unit is present; each spectral_coverage range carries
      its own unit. Intensity units (W m-2 sr-1 nm-1, DN, relative flux, etc.)
      are free text in the record's intensity_units field and are not
      constrained here. mz is mass-to-charge (m/z); ppm is NMR chemical shift;
      hz, thz and kev are canonical spellings of Hz, THz and keV. channel is an index,
      not a physical unit. unknown is an explicit missing-unit marker, never
      an inferred wavelength or energy unit. These last two require a
      known_gaps explanation in the record.
    canonical:
      - nm
      - um
      - cm-1
      - angstrom
      - mz
      - ppm
      - hz
      - thz
      - kev
      - channel
      - unknown
    aliases:
      nanometre: nm
      nanometer: nm
      nanometres: nm
      nanometers: nm
      "µm": um
      "μm": um
      micron: um
      microns: um
      micrometre: um
      micrometer: um
      "cm^-1": cm-1
      "cm⁻¹": cm-1
      wavenumber: cm-1
      wavenumbers: cm-1
      "Å": angstrom
      Angstrom: angstrom
      angstroms: angstrom
      "m/z": mz
      mass-to-charge: mz
      parts-per-million: ppm
      hertz: hz
      terahertz: thz
      kiloelectronvolt: kev
      band-index: channel
      bin-index: channel
      unspecified-axis-unit: unknown

